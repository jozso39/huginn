services:
  huginn:
    build: .
    image: huginn:local
    container_name: huginn
    # Loopback only. Huginn holds tokens to all your accounts; reach it through a
    # tailnet or VPN (e.g. `tailscale serve`), never a public port.
    ports:
      - 127.0.0.1:${HUGINN_HOST_PORT:-9929}:3000
    volumes:
      - ./data:/app/data
      # signal-cli's Unix socket (docs/signal.md); an empty folder when Signal is not used.
      - ./signal:/app/signal
    env_file: .env
    environment:
      HUGINN_DB_PATH: /app/data/huginn.db
      PORT: 3000
    user: '1000:1000'
    restart: unless-stopped
