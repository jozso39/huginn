<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout use the whole screen on notched phones;
         styles.css pads with the safe-area insets instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>Huginn</title>
    <script>
      // The theme chosen in Settings, applied before the first paint (src/theme.ts
      // keeps it here); the server's copy wins once it has loaded.
      try {
        var theme = localStorage.getItem('huginn.theme');

        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
