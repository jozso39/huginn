<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Huginn</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f2;
        --text: #1c1d20;
        --muted: #6d6f75;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --text: #e8e6e1;
          --muted: #979aa1;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      main {
        height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        animation: breathe 1.6s ease-in-out infinite;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      @keyframes breathe {
        50% {
          transform: scale(0.94);
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown while the shell starts Huginn's server; the shell then navigates away. -->
    <main>
      <img src="huginn.png" alt="" />
      <strong>Huginn</strong>
      <p>Starting…</p>
    </main>
  </body>
</html>
