[package]
name = "huginn-desktop"
version = "0.1.0"
description = "Huginn for macOS: the shell around Huginn's server"
edition = "2021"
publish = false

# The process macOS shows in the menu bar and Activity Monitor.
[[bin]]
name = "Huginn"
path = "src/main.rs"

[lib]
name = "huginn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
base64 = "0.22"
url = "2"
tokio = { version = "1", features = ["time"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
