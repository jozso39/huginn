# Builds Huginn for macOS and publishes it when a version tag (v1.2.3) is pushed.
# `bun run release 1.2.3` makes such a tag. The app checks the latest release every
# hour and installs it on restart (desktop/, tauri-plugin-updater).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      # huginn-messenger, the Messenger helper bundled next to the server.
      - uses: actions/setup-go@v5
        with:
          go-version-file: messenger/go.mod
          cache-dependency-path: messenger/go.sum

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - run: bun install --frozen-lockfile

      - name: Checks and tests
        run: bun run code:check && bun run test && (cd messenger && go test ./...)

      - name: The tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"

      # The version's CHANGELOG.md section is the release's text (and the update's notes);
      # a version without one stops here.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            bun scripts/changelog.ts "${GITHUB_REF_NAME#v}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      # Builds the web app and the sidecars (beforeBuildCommand), the .app, the
      # .dmg and the signed update; publishes them with latest.json for the updater.
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: bunx tauri
          tagName: ${{ github.ref_name }}
          releaseName: Huginn ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

      - name: The app is signed (ad hoc) correctly
        run: codesign -v --deep --strict desktop/target/release/bundle/macos/Huginn.app
